name: Mayhem
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.os }} shared=${{ matrix.shared }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        shared: [false]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            triplet: x64-linux

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to the Container registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: mayhem/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Start analysis for fuzz_codec_bytes
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_codec_bytes.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_coprocessor_codec_row_v2_binary_search
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_coprocessor_codec_row_v2_binary_search.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_codec_number
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_codec_number.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_coprocessor_codec_time_from_parse
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_coprocessor_codec_time_from_parse.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_coprocessor_codec_decimal
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_coprocessor_codec_decimal.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_coprocessor_codec_time_from_u64
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_coprocessor_codec_time_from_u64.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_coprocessor_codec_duration_from_nanos
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_coprocessor_codec_duration_from_nanos.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_hash_decimal
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_hash_decimal.mayhemfile
                --duration 300

      - name: Start analysis for fuzz_coprocessor_codec_duration_from_parse
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }}
                --file mayhem/fuzz_coprocessor_codec_duration_from_parse.mayhemfile
                --duration 300
